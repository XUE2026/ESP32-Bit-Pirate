name: Build ESP32 Bit Pirate

on:
  push:
    branches:
      - pioarduino
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install PlatformIO
        run: |
          pip install platformio

      - name: Build s3-devkit-n16-r8
        run: |
          pio run -e s3-devkit-n16-r8 --verbose

      - name: Rename artifacts with device-specific names
        run: |
          BUILD_DIR=".pio/build/s3-devkit-n16-r8"
          # Rename the single 0x0 merged binary with full device name
          if [ -f "$BUILD_DIR/firmware.factory.bin" ]; then
            cp "$BUILD_DIR/firmware.factory.bin" "$BUILD_DIR/ESP32-S3-N16R8_BitPirate_firmware_0x0.bin"
          fi
          # Copy other files with prefixed names for clarity
          if [ -f "$BUILD_DIR/bootloader.bin" ]; then
            cp "$BUILD_DIR/bootloader.bin" "$BUILD_DIR/ESP32-S3-N16R8_bootloader.bin"
          fi
          if [ -f "$BUILD_DIR/partitions.bin" ]; then
            cp "$BUILD_DIR/partitions.bin" "$BUILD_DIR/ESP32-S3-N16R8_partitions.bin"
          fi
          if [ -f "$BUILD_DIR/firmware.bin" ]; then
            cp "$BUILD_DIR/firmware.bin" "$BUILD_DIR/ESP32-S3-N16R8_firmware_app.bin"
          fi
          echo "=== Renamed artifacts ==="
          ls -lh "$BUILD_DIR"/*.bin "$BUILD_DIR"/firmware.elf 2>/dev/null

      - name: Upload firmware artifacts
        uses: actions/upload-artifact@v4
        with:
          name: firmware-s3-devkit-n16-r8
          path: |
            .pio/build/s3-devkit-n16-r8/*.bin
            .pio/build/s3-devkit-n16-r8/firmware.elf
          retention-days: 7